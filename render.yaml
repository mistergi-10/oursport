services:
  - type: web
    name: oursport-api
    runtime: node
    rootDir: server
    buildCommand: npm ci && npm run build
    preDeployCommand: node dist/db/migrate.js
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oursport-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"

  - type: web
    name: oursport-web
    runtime: static
    rootDir: oursport
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://oursport-api.onrender.com

databases:
  - name: oursport-db
    databaseName: oursport
    user: oursport
    plan: basic-256mb
